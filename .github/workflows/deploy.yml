name: Build en deploy

# Elke push wordt gecontroleerd (lint, typecheck, tests, datavalidatie, build).
# Alleen de standaardbranch (straks `main`) wordt gepubliceerd op GitHub Pages.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Opmaak controleren
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Denkersdata valideren
        run: npm run validate:data

      - name: Build (inclusief typecheck)
        run: npm run build

      - name: Pages-artifact uploaden
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Vereist eenmalig: Settings → Pages → Build and deployment → Source: GitHub Actions.
      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
